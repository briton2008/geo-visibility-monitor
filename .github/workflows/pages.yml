name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v6
      - name: Build static demo
        run: |
          mkdir -p _site/assets
          cp web/index.html web/styles.css web/app.js web/language.js web/robots.txt web/sitemap.xml web/llms.txt _site/
          cp web/answer-data.example.js _site/answer-data.js
          cp assets/logo.png assets/community-wechat.jpg assets/geo-visibility-lab-cover.png _site/assets/
          cp PROVIDERS.md _site/PROVIDERS.md
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
